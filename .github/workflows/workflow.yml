name: Build and Publish Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore GaokaoCountdown.sln

      - name: Build
        run: msbuild GaokaoCountdown.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Publish
        run: msbuild GaokaoCountdown/GaokaoCountdown.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:OutputPath=..\publish /t:Build

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./publish/Unicount.exe
          asset_name: Unicount-${{ github.ref_name }}.exe
          asset_content_type: application/octet-stream